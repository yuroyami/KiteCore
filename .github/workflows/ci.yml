name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-
      - name: Build (JVM, Android, JS, Wasm)
        run: ./kotlin build -p jvm -p android -p js -p wasmJs
      - name: Test (JVM, Android host, Wasm in the browser)
        run: ./kotlin test -p jvm -p android -p wasmJs
      - name: Check the public API and KiteCore.VERSION
        run: ./kotlin check abi version

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-
      - name: Test (macOS, iOS simulator)
        run: ./kotlin test -p macosArm64 -p iosSimulatorArm64
