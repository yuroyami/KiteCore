name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (JVM, Android host, JS, Wasm, ABI check)
        run: >
          ./gradlew :kitecore:jvmTest :kitecore:testAndroidHostTest
          :kitecore:jsBrowserTest :kitecore:jsNodeTest
          :kitecore:wasmJsBrowserTest :kitecore:wasmJsNodeTest
          :kitecore:assemble check

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Apple targets (macOS + iOS simulator)
        run: ./gradlew :kitecore:macosArm64Test :kitecore:iosSimulatorArm64Test
