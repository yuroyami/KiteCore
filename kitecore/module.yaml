product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, iosX64, macosArm64, js, wasmJs ]

description: >-
  Runtime utilities for Kotlin Multiplatform: one IO dispatcher name for every target, progress-reporting futures,
  weak references and platform identity in common code, a portable String.format, and a few coroutine and Flow helpers.

dependencies:
  # Exported, because ioDispatcher is a CoroutineDispatcher.
  - $libs.kotlinx.coroutines.core: exported

test-dependencies:
  - $libs.kotlinx.coroutines.test

# `./kotlin publish mavenLocal -m kitecore` puts a build into ~/.m2 for tests in other projects.
repositories:
  - url: mavenLocal
    publish: true
    resolve: false

settings:
  kotlin:
    # Keep abi-tools in build-plugins/abi-check/module.yaml at the same version.
    version: 2.4.21
    explicitApi: strict
    # WeakRef is an expect/actual class, which needs this flag in Kotlin 2.4.
    freeCompilerArgs: [ -Xexpect-actual-classes ]
  jvm:
    jdk:
      version: 21
    # JVM 11 bytecode, so the library runs on JDK 11 and later.
    release: 11
  android:
    namespace: io.github.yuroyami.kitecore
    compileSdk:
      apiLevel: 37
      minorApiLevel: 2
    minSdk: 21
  publishing:
    enabled: true
    group: io.github.yuroyami
    # After a change, run `./kotlin do updateVersion` to update KiteCore.VERSION.
    version: 0.2.0
    pom:
      name: KiteCore
      url: https://github.com/yuroyami/KiteCore
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
      developers:
        - id: yuroyami
          name: yuroyami
          url: https://github.com/yuroyami
      scm:
        url: https://github.com/yuroyami/KiteCore
        connection: scm:git:git://github.com/yuroyami/KiteCore.git
        developerConnection: scm:git:ssh://git@github.com/yuroyami/KiteCore.git
    signArtifacts: true
    publishSources: true
    mavenCentral:
      enabled: true
      publishingMode: auto

# -Xexport-kdoc keeps the KDoc in the native klibs.
settings@native:
  kotlin:
    freeCompilerArgs: [ -Xexport-kdoc ]

# Gradle named the klib "io.github.yuroyami:kitecore". Keep that name, or libraries built against
# earlier releases fail to link on Kotlin/Native. Set it per platform: on @native, it also renames
# the klib of the shared Apple code, which must keep its own name (kitecore_apple).
settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitecore, -Xshort-module-name=kitecore ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitecore, -Xshort-module-name=kitecore ]

settings@iosX64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitecore, -Xshort-module-name=kitecore ]

settings@macosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitecore, -Xshort-module-name=kitecore ]

settings@web:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kitecore ]

# Tests compile into their own klib, which needs a different name. The test blocks name the same
# platforms as the blocks above, so the toolchain applies them last.
test-settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitecore_test, -Xshort-module-name=kitecore_test ]

test-settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitecore_test, -Xshort-module-name=kitecore_test ]

test-settings@iosX64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitecore_test, -Xshort-module-name=kitecore_test ]

test-settings@macosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitecore_test, -Xshort-module-name=kitecore_test ]

test-settings@web:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=kitecore_test ]

plugins:
  version-constant:
    enabled: true
    file: src/io/github/yuroyami/kitecore/KiteCore.kt
  abi-check:
    enabled: true
  dokka:
    enabled: true
    moduleName: KiteCore
    includes: [ Module.md ]
    customStyleSheets: [ ../docs/api-theme/kite.css ]
    templatesDir: ../dokka-templates
    footerMessage: Apache-2.0 · KiteCore is part of the Kite family.
