site_name: KiteCore
site_url: https://yuroyami.github.io/KiteCore/
site_description: "Small runtime utilities for Kotlin Multiplatform: an IO dispatcher on every target, progress-reporting futures, weak references in common code, platform identity, Web Worker offload, and about 450 tested extension functions."
site_author: yuroyami
copyright: Apache-2.0

repo_name: yuroyami/KiteCore
repo_url: https://github.com/yuroyami/KiteCore
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share

extra_css:
  - theme/kite.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Core:
      - IO dispatcher: io-dispatcher.md
      - Progress futures: progress-future.md
      - Weak references: weakref.md
      - Platform identity: platform.md
      - Web Workers: webworker.md
  - Extensions:
      - Text: text.md
      - Collections: collections.md
      - Flow: flow.md
      - Coroutines: coroutines.md
      - Math: math.md
      - Encoding: encoding.md
      - Structures: structures.md
      - Time: time.md
      - Random: random.md
      - Util: util.md
  - API reference: https://yuroyami.github.io/KiteCore/api/
